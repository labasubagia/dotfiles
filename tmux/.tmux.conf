# tmux.conf — dev-focused, minimal (tokyonight night accents)

# prefix
set -g prefix C-b
unbind C-b
bind C-b send-prefix

# windows start at 1; renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# mouse on (select/resize panes, scroll)
set -g mouse on

# clipboard: yank in copy-mode -> system clipboard (OSC52, no external tool)
set -g set-clipboard on
set -g mode-keys vi

# scrollback
set -g history-limit 5000

# dev ergonomics
set -g escape-time 10          # reduce ESC delay for vim
set -g default-terminal "tmux-256color"
set -g focus-events on

# reload config
bind r source-file ~/.tmux.conf \; display-message "reloaded"

# splits (stay in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# minimal status bar (tokyonight night)
set -g status-interval 5
set -g status-style bg=colour236,fg=colour252
set -g status-left "#[fg=colour111]tmux#[default]"
set -g status-right "#[fg=colour245]#(hostname -s)#[default]"
